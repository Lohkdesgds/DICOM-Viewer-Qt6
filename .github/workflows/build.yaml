name: Build ImageViewer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libopengl-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download Qt6
        run: |
          python3 scripts/install_qt.py

      - name: Make release
        run: |
          python3 scripts/release.py

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
            name: DIST_${{ matrix.os }}
            path: dist/